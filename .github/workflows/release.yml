name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm trusted publishing and provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter raditail build

      # Never publish something the packaging checks reject.
      - name: Lint package metadata
        run: pnpm --filter raditail lint:pkg
      - name: Check type resolution
        run: pnpm --filter raditail check:types
      - name: Check bundle budget
        run: pnpm --filter raditail bundle:budget

      - name: Version, publish and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Consume any pending changesets: bump versions, write changelogs.
          pnpm changeset version
          pnpm install --no-frozen-lockfile --lockfile-only

          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: version packages [skip ci]"
          fi

          # Publishes through npm trusted publishing and creates tags.
          pnpm changeset publish

          # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this
          # cannot loop.
          git push --follow-tags origin HEAD:main

          # Create GitHub releases with changelog notes for any newly published tags.
          node packages/raditail/scripts/create-github-release.mjs
